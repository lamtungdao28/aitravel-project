spring:
  application:
    name: travelhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/travelhub}
    username: ${DB_USERNAME:travelhub}
    password: ${DB_PASSWORD:travelhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
travelhub:
  cache:
    enabled: ${CACHE_ENABLED:true}
    destination-ttl: ${DESTINATION_CACHE_TTL:30m}
    place-ttl: ${PLACE_CACHE_TTL:10m}
    ranking-ttl: ${RANKING_CACHE_TTL:5m}
    summary-ttl: ${SUMMARY_CACHE_TTL:30m}
ai:
  enabled: ${AI_ENABLED:false}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  timeout: ${AI_TIMEOUT:20s}
  max-reviews: ${AI_MAX_REVIEWS:30}
  max-review-chars: ${AI_MAX_REVIEW_CHARS:1000}
  max-candidates: ${AI_MAX_CANDIDATES:30}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1500}
jwt:
  secret: ${JWT_SECRET:}
  access-ttl: ${JWT_ACCESS_TTL:15m}
  refresh-ttl: ${JWT_REFRESH_TTL:7d}
