services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-travelhub}
      POSTGRES_USER: ${DB_USERNAME:-travelhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travelhub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-travelhub}
      DB_USERNAME: ${DB_USERNAME:-travelhub}
      DB_PASSWORD: ${DB_PASSWORD:-travelhub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      DESTINATION_CACHE_TTL: ${DESTINATION_CACHE_TTL:-30m}
      PLACE_CACHE_TTL: ${PLACE_CACHE_TTL:-10m}
      RANKING_CACHE_TTL: ${RANKING_CACHE_TTL:-5m}
      SUMMARY_CACHE_TTL: ${SUMMARY_CACHE_TTL:-30m}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT: ${AI_TIMEOUT:-20s}
      AI_MAX_REVIEWS: ${AI_MAX_REVIEWS:-30}
      AI_MAX_REVIEW_CHARS: ${AI_MAX_REVIEW_CHARS:-1000}
      AI_MAX_CANDIDATES: ${AI_MAX_CANDIDATES:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1500}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-true}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@travelhub.test}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
volumes:
  postgres_data:
